<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>نایت‌درایو — زندگی و تیونینگ</title>
<style>
:root{--bg:#090c11;--panel:#11161d;--panel2:#171d25;--line:#26303b;--muted:#8a96a3;--text:#edf2f7;--orange:#ff6a18;--cyan:#57d4ff;--green:#55d68b;--red:#ff4d67;--yellow:#ffc857}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,#202834 0,#090c11 42%);color:var(--text);overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr) 76px}.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(9,12,17,.94);z-index:5}.brand{font-size:20px;font-weight:900;letter-spacing:-1px}.brand b{color:var(--orange)}.stats{display:flex;gap:8px;margin-right:auto}.stat{height:38px;min-width:104px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#11161d}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;font-size:13px;margin-top:2px}.coin{color:var(--yellow)}.xp{color:var(--cyan)}.top-actions{display:flex;gap:6px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#151b22;color:white}.main{min-height:0;display:grid;grid-template-columns:230px minmax(360px,1fr) 290px}.sidebar,.rightbar{background:rgba(13,17,23,.96);border-left:1px solid var(--line);padding:12px;overflow:auto}.sidebar{border-left:0;border-right:1px solid var(--line)}.stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#141a22 0 55%,#0d1116 55%);}.stage:before{content:"";position:absolute;inset:55% -20% -20%;background:linear-gradient(175deg,transparent 25%,#151b22 26% 27%,transparent 28%),repeating-linear-gradient(90deg,#171d22 0 80px,#11161a 81px 82px);transform:perspective(300px) rotateX(12deg);transform-origin:top}.garage-name{position:absolute;top:16px;right:18px;color:#9ba6b2;font-size:11px}.garage-name strong{display:block;color:white;font-size:15px;margin-top:3px}.car-wrap{position:absolute;left:50%;top:53%;width:min(620px,76%);height:280px;transform:translate(-50%,-50%)}.car{position:absolute;width:78%;height:48%;left:11%;bottom:13%;filter:drop-shadow(0 24px 15px rgba(0,0,0,.55));transition:.35s}.car-body{position:absolute;inset:28% 2% 12%;clip-path:polygon(8% 34%,24% 18%,38% 12%,55% 10%,72% 20%,92% 38%,100% 55%,96% 82%,86% 91%,14% 91%,3% 76%,0 56%);background:linear-gradient(155deg,var(--paint1) 0 40%,var(--paint2) 41% 70%,#15191f 71%);border:2px solid rgba(255,255,255,.18)}.car-cabin{position:absolute;left:29%;top:19%;width:44%;height:43%;clip-path:polygon(18% 100%,28% 13%,67% 0,88% 100%);background:linear-gradient(135deg,#8bdcff 0,#1a2b38 38%,#090d12 39%);border:2px solid rgba(255,255,255,.16)}.wheel{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;bottom:4%;background:radial-gradient(circle,#1e252d 0 12%,#bbc2c7 13% 16%,#151a20 17% 38%,#050606 39% 58%,#232a31 59%);border:5px solid #090b0d}.wheel.l{left:15%}.wheel.r{right:11%}.spoiler{position:absolute;width:33%;height:7%;right:1%;top:30%;border-radius:5px;background:var(--paint2);transform:rotate(-4deg);display:none}.spoiler.on{display:block}.spoiler:after{content:"";position:absolute;width:7%;height:110%;right:15%;top:70%;background:#252c33}.kit{position:absolute;left:0;right:0;bottom:7%;height:14%;background:var(--paint2);clip-path:polygon(0 30%,100% 30%,96% 100%,4% 100%);display:none}.kit.on{display:block}.neon{position:absolute;left:18%;right:17%;bottom:7%;height:3%;background:#ff2b78;box-shadow:0 8px 22px #ff2b78;display:none}.neon.on{display:block}.car-stats{position:absolute;bottom:18px;left:18px;display:flex;gap:8px}.pill{border:1px solid var(--line);background:rgba(11,14,18,.88);border-radius:20px;padding:7px 10px;font-size:10px}.pill b{color:var(--orange)}.section-title{font-size:11px;color:#bac4cf;font-weight:bold;margin:10px 0 8px}.nav{display:grid;gap:5px}.nav button{height:48px;border:1px solid transparent;border-radius:8px;background:transparent;color:#aab4bf;text-align:right;padding:0 11px;display:flex;align-items:center;gap:10px}.nav button.active{background:#1a2027;border-color:#303a45;color:white}.nav button span:first-child{font-size:18px}.upgrade-card{border:1px solid var(--line);background:#151b22;border-radius:10px;padding:10px;margin-bottom:8px}.upgrade-card h4{margin:0 0 7px;font-size:12px}.bar{height:5px;border-radius:4px;background:#29313a;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}.bar i.hot{background:var(--orange)}.bottom{display:grid;grid-template-columns:230px 1fr 290px;border-top:1px solid var(--line);background:#0d1116}.dock{display:flex;justify-content:center;gap:8px;padding:11px}.dock button{width:58px;border:0;border-radius:8px;background:#151b22;color:#aeb8c3;font-size:9px}.dock button.active{background:var(--orange);color:white}.dock button i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}.content-card{height:100%;padding:12px;overflow:auto}.view-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.view-title h3{margin:0;font-size:14px}.close{border:1px solid var(--line);background:#151b22;color:#abb6c1;border-radius:6px;width:28px;height:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.shop-item{border:1px solid var(--line);border-radius:9px;background:#151b22;padding:9px}.shop-item h4{font-size:11px;margin:6px 0}.shop-item p{font-size:9px;color:var(--muted);margin:0 0 7px}.buy{width:100%;height:29px;border:0;border-radius:6px;background:var(--orange);color:white;font-size:10px}.buy:disabled{background:#303844;color:#87929d}.swatch{display:flex;gap:5px}.swatch button{width:25px;height:25px;border:2px solid #2d3742;border-radius:50%}.swatch button.active{border-color:white}.casino{border:1px solid #3a2c17;background:linear-gradient(135deg,#1c1912,#12171d);border-radius:10px;padding:11px}.slots{height:64px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.slot{display:grid;place-items:center;border:1px solid #3d4650;border-radius:7px;background:#090c10;font-size:26px}.bet-row{display:flex;gap:5px}.bet-row button{flex:1;height:32px;border:1px solid var(--line);border-radius:6px;background:#1b222a;color:white}.bet-row .spin{background:var(--yellow);color:#181100;border:0;font-weight:bold}.progress{height:4px;background:#29313a;border-radius:3px;margin-top:7px}.progress i{display:block;height:100%;width:40%;background:var(--green)}.toast{position:fixed;left:50%;top:68px;transform:translate(-50%,-20px);background:#edf2f7;color:#11151a;border-radius:8px;padding:9px 14px;font-size:11px;opacity:0;transition:.25s;z-index:20}.toast.show{transform:translate(-50%,0);opacity:1}.panel-hidden{display:none!important}@media(max-width:900px){.main{grid-template-columns:58px 1fr 230px}.bottom{grid-template-columns:58px 1fr 230px}.sidebar{padding:8px 5px}.sidebar .nav button{justify-content:center;padding:0}.sidebar .nav button span:last-child,.sidebar .section-title{display:none}.sidebar .upgrade-card{display:none}.topbar{padding:0 8px}.brand{font-size:15px}.stat{min-width:78px}.top-actions{display:none}}@media(max-width:620px){body{overflow:auto}.app{height:100dvh;grid-template-rows:52px minmax(0,1fr) 68px}.topbar{gap:5px}.brand{font-size:14px}.stats{gap:4px}.stat{min-width:62px;height:34px;padding:5px}.stat:nth-child(3){display:none}.main{grid-template-columns:1fr}.sidebar,.rightbar{display:none}.bottom{grid-template-columns:1fr}.bottom .left-dock{display:none}.content-card{position:absolute;bottom:68px;left:0;right:0;height:240px;border-top:1px solid var(--line);z-index:8}.car-wrap{width:94%;height:230px}.car-stats{bottom:8px}.bottom .dock{padding:7px}.dock button{height:50px}.toast{top:58px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><b>نایت</b>درایو</div><div class="stats"><div class="stat"><small>اعتبار</small><strong class="coin" id="money">۳۲٬۵۰۰</strong></div><div class="stat"><small>امتیاز</small><strong class="xp" id="rep">۱٬۲۴۰ XP</strong></div><div class="stat"><small>سطح</small><strong id="level">۱۲</strong></div></div><div class="top-actions"><button class="icon-btn" id="saveBtn" title="ذخیره">💾</button><button class="icon-btn" title="تنظیمات">⚙</button></div></header>
<div class="main"><aside class="sidebar"><div class="section-title">مکان‌های بازی</div><nav class="nav" id="locations"><button data-view="garage" class="active"><span>🏠</span><span>کارگاه شخصی</span></button><button data-view="casino"><span>♠</span><span>کازینو نایت</span></button><button data-view="jobs"><span>⚡</span><span>مأموریت‌های زیرزمینی</span></button><button data-view="bank"><span>🏦</span><span>بانک مرکزی</span></button><button data-view="house"><span>🛋️</span><span>خانه من</span></button></nav><div class="section-title">وضعیت خودرو</div><div class="upgrade-card"><h4>قدرت موتور <span id="engineStat">۶۸٪</span></h4><div class="bar"><i class="hot" id="engineBar" style="width:68%"></i></div></div><div class="upgrade-card"><h4>ترمز و تعلیق <span id="handlingStat">۴۲٪</span></h4><div class="bar"><i id="handlingBar" style="width:42%"></i></div></div></aside>
<section class="stage"><div class="garage-name">گاراژ اختصاصی<strong>ماگنو زاگاتو</strong></div><div class="car-wrap"><div class="car" id="car" style="--paint1:#f05a17;--paint2:#bd3510"><div class="spoiler" id="spoiler"></div><div class="cabin car-cabin"></div><div class="car-body"></div><div class="kit" id="kit"></div><div class="neon" id="neon"></div><div class="wheel l"></div><div class="wheel r"></div></div></div><div class="car-stats"><div class="pill">سطح خودرو <b id="carLevel">Lv. 4</b></div><div class="pill">قدرت <b id="power">۳۴۸ hp</b></div><div class="pill">ارزش <b id="value">۸۵۰K</b></div></div></section>
<aside class="rightbar" id="rightbar"><div class="view-title"><h3 id="panelTitle">تیونینگ حرفه‌ای</h3><button class="close" id="closePanel">×</button></div><div id="panelBody"></div></aside></div>
<footer class="bottom"><div class="left-dock"></div><div class="dock" id="dock"><button data-view="tune" class="active"><i>🔧</i>تیونینگ</button><button data-view="paint"><i>🎨</i>رنگ</button><button data-view="kit"><i>🏎️</i>بدنه</button><button data-view="casino"><i>♠</i>کازینو</button><button data-view="house"><i>🏠</i>خانه</button></div><div class="content-card" id="contentCard"><div id="bottomPanel"></div></div></footer></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state=JSON.parse(localStorage.getItem('nightdrive-save')||'null')||{money:32500,rep:1240,level:12,engine:68,handling:42,paint1:'#f05a17',paint2:'#bd3510',spoiler:false,kit:false,neon:false,bank:0,house:1};
const fa=n=>Math.round(n).toLocaleString('fa-IR');
function sync(){ $('#money').textContent=fa(state.money);$('#rep').textContent=fa(state.rep)+' XP';$('#level').textContent=fa(state.level);$('#engineStat').textContent=state.engine+'٪';$('#handlingStat').textContent=state.handling+'٪';$('#engineBar').style.width=state.engine+'%';$('#handlingBar').style.width=state.handling+'%';$('#car').style.setProperty('--paint1',state.paint1);$('#car').style.setProperty('--paint2',state.paint2);$('#spoiler').classList.toggle('on',state.spoiler);$('#kit').classList.toggle('on',state.kit);$('#neon').classList.toggle('on',state.neon);$('#power').textContent=fa(348+state.engine)+' hp';}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x.t);x.t=setTimeout(()=>x.classList.remove('show'),1800)}
function buy(cost,label,fn){if(state.money<cost)return toast('اعتبار کافی ندارید');state.money-=cost;fn();sync();toast(label+' تکمیل شد')}
const panels={
tune:`<div class="grid"><div class="shop-item"><h4>ECU مرحله ۱</h4><p>افزایش ۸٪ قدرت موتور</p><button class="buy" data-cost="4200" data-type="engine">خرید — ۴٬۲۰۰</button></div><div class="shop-item"><h4>توربو شهری</h4><p>افزایش ۱۲٪ شتاب</p><button class="buy" data-cost="7800" data-type="engine2">خرید — ۷٬۸۰۰</button></div><div class="shop-item"><h4>تعلیق Sport</h4><span class="p">بهبود کنترل مسیر</span><button class="buy" data-cost="3600" data-type="handling">خرید — ۳٬۶۰۰</button></div><div class="shop-item"><h4>ترمز رانشی</h4><p>افزایش ایمنی و توقف</p><button class="buy" data-cost="2900" data-type="handling2">خرید — ۲٬۹۰۰</button></div></div>`,
paint:`<div class="section-title">رنگ نئو-گراف</div><div class="swatch"><button style="background:#f05a17" data-paint="#f05a17,#bd3510"></button><button style="background:#297be3" data-paint="#3c9cff,#1552a1"></button><button style="background:#e8edf2" data-paint="#eef3f7,#8795a3"></button><button style="background:#33c69a" data-paint="#43dfaf,#087c60"></button><button style="background:#bc55dc" data-paint="#da78f5,#743091"></button></div><div class="section-title">نگهداری و واکس</div><div class="shop-item"><h4>پوشش سرامیکی</h4><p>افزایش ارزش خودرو</p><button class="buy" data-cost="1800" data-type="value">خرید — ۱٬۸۰۰</button></div>`,
kit:`<div class="grid"><div class="shop-item"><h4>اسپریر کربن</h4><p>نمای عقب اسپرت</p><button class="buy" data-cost="4600" data-type="spoiler">خرید — ۴٬۶۰۰</button></div><div class="shop-item"><h4>کیت بدنه Wide</h4><p>زمینه جوی حرفه‌ای</p><button class="buy" data-cost="9200" data-type="kit">خرید — ۹٬۲۰۰</button></div><div class="shop-item"><h4>نورپردازی زیربدنه</h4><p>اسلایت نئون نایت</p><button class="buy" data-cost="3100" data-type="neon">خرید — ۳٬۱۰۰</button></div><div class="shop-item"><h4>چرخ فورج ۱۹</h4><p>گریپ و ظاهر مخصوص</p><button class="buy" data-cost="6500" data-type="wheel">خرید — ۶٬۵۰۰</button></div></div>`,
casino:`<div class="casino"><div class="view-title"><h3>اسلات نایت</h3><span class="coin">۷٪ مزیت خانه</span></div><div class="slots"><div class="slot">♦</div><div class="slot">7</div><div class="slot">♠</div></div><div class="bet-row"><button data-bet="500">۵۰۰</button><button data-bet="1000">۱٬۰۰۰</button><button class="spin" id="spin">چرخش</button></div></div>`,
house:`<div class="grid"><div class="shop-item"><h4>مبل نئونی</h4><p>کاهش خستگی بین مأموریت‌ها</p><button class="buy" data-cost="3500" data-type="house1">خرید — ۳٬۵۰۰</button></div><div class="shop-item"><h4>اتاق گیمینگ</h4><p>افزایش امتیاز روزانه</p><button class="buy" data-cost="8200" data-type="house2">خرید — ۸٬۲۰۰</button></div><div class="shop-item"><h4>نشان شخصی</h4><p>سطح شهرت خانه</p><button class="buy" data-cost="5200" data-type="house3">خرید — ۵٬۲۰۰</button></div><div class="shop-item"><h4>لوازم خانه هوشمند</h4><p>سیستم پشتیبان خودکار</p><button class="buy" data-cost="12000" data-type="house4">خرید — ۱۲٬۰۰۰</button></div></div>`
};
function openView(v){$$('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(panels[v]){$('#bottomPanel').innerHTML=panels[v];$('#panelTitle').textContent={tune:'تیونینگ حرفه‌ای',paint:'تودوزی و رنگ',kit:'کیت بدنه و اسپرت',casino:'کازینو نایت',house:'ارتقای خانه'}[v];bindPanel()}else openLocation(v)}
function openLocation(v){const titles={casino:'کازینو نایت',jobs:'مأموریت‌های زیرزمینی',bank:'بانک مرکزی',house:'خانه من',garage:'کارگاه شخصی'};$('#panelTitle').textContent=titles[v];if(v==='casino')$('#panelBody').innerHTML=panels.casino;else if(v==='jobs')$('#panelBody').innerHTML=`<div class="grid"><div class="shop-item"><h4>تحویل قطعات</h4><p>پاداش ۴٬۸۰۰ + ۸۰ XP</p><button class="buy" data-cost="0" data-job="4800">شروع مأموریت</button></div><div class="shop-item"><h4>مسابقه شبانه</h4><p>پاداش ۸٬۵۰۰ + ۱۲۰ XP</p><button class="buy" data-cost="0" data-job="8500">شروع مسابقه</button></div></div>`;else if(v==='bank')$('#panelBody').innerHTML=`<div class="casino"><h4>سپرده سودی</h4><p>موجودی بانک: <b class="coin" id="bankBal">${fa(state.bank)}</b></p><div class="bet-row"><button id="dep">واریز ۵٬۰۰۰</button><button id="wd">برداشت همه</button></div><div class="progress"><i id="bankProgress"></i></div><small style="color:#8a96a3">سود روزانه: ۱.۵٪ حتی خارج از بازی</small></div>`;else if(v==='garage')$('#panelBody').innerHTML=panels.tune;else $('#panelBody').innerHTML=panels.house;bindPanel()}
let bet=500;
function bindPanel(){ $$('.buy').forEach(b=>b.onclick=()=>{let cost=+b.dataset.cost;if(b.dataset.job){state.money+=+b.dataset.job;state.rep+=b.dataset.job==='4800'?80:120;sync();toast('مأموریت با موفقیت انجام شد');return}buy(cost,'خرید',()=>{let t=b.dataset.type;if(t==='engine'||t==='engine2')state.engine=Math.min(100,state.engine+(t==='engine'?8:12));if(t==='handling'||t==='handling2')state.handling=Math.min(100,state.handling+(t==='handling'?10:8));if(t==='spoiler')state.spoiler=true;if(t==='kit')state.kit=true;if(t==='neon')state.neon=true;if(t?.startsWith('house'))state.house++;})});$$('[data-paint]').forEach(b=>b.onclick=()=>{let p=b.dataset.paint.split(',');state.paint1=p[0];state.paint2=p[1];sync();$$('[data-paint]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$$('[data-bet]').forEach(b=>b.onclick=()=>bet=+b.dataset.bet);if($('#spin'))$('#spin').onclick=()=>spin();if($('#dep'))$('#dep').onclick=()=>{if(state.money<5000)return toast('اعتبار کافی نیست');state.money-=5000;state.bank+=5000;sync();$('#bankBal').textContent=fa(state.bank)};if($('#wd'))$('#wd').onclick=()=>{state.money+=state.bank;state.bank=0;sync();$('#bankBal').textContent='۰'} }
function spin(){if(state.money<bet)return toast('اعتبار کافی نیست');state.money-=bet;let icons=['♦','7','♠','●','★'];let out=$$('.slot');let wins=Math.random()<.28;let vals=wins?[3,3,3]:[Math.floor(Math.random()*5),Math.floor(Math.random()*5),Math.floor(Math.random()*5)];vals.forEach((n,i)=>setTimeout(()=>out[i].textContent=icons[n],i*160));setTimeout(()=>{if(wins){state.money+=bet*5;state.rep+=30;toast('برد بزرگ! جایزه '+fa(bet*5));}else toast('موج بعدی منتظرت است');sync()},520)}
$$('#locations button').forEach(b=>b.onclick=()=>{$$('#locations button').forEach(x=>x.classList.remove('active'));b.classList.add('active');openLocation(b.dataset.view)});$$('#dock button').forEach(b=>b.onclick=()=>openView(b.dataset.view));$('#closePanel').onclick=()=>$('#rightbar').classList.toggle('panel-hidden');$('#saveBtn').onclick=()=>{localStorage.setItem('nightdrive-save',JSON.stringify(state));toast('بازی ذخیره شد')};
setInterval(()=>{if(state.bank>0){state.bank=Math.round(state.bank*1.0015);sync()}},60000);sync();openView('tune');
</script></body></html>
